<!DOCTYPE html >
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../css.css">
    <link rel="stylesheet" href="../script.js">
</head>
<body class="body"> 
    <form action="../verificacao_cadastro_cliente.php" method="post">
        <div style="display: flex; justify-content: center; align-items: center; min-height: 100vh;">
            <table align="center">
                <tr>
                    <td align="center" colspan="2">
                        <h1>
                            Entre na sua conta
                        </h1>
                    </td>
                </tr>
                <tr>
                    <th>
                        CPF:
                    </th>
                    <td>
                        <input type="text" id="cpf" name="cpf" maxlength="14" oninput="mascaraCPF(this)"  placeholder="000.000.000-00" required>
                    </td>
                </tr>
                <tr>
                    <th>
                        Senha:
                    </th>

                    <td>
                        <input type="password" name="senha" id="senha_tela_de_login" placeholder="Digite sua senha" required>
                    </td>
                </tr>
                <tr>
                    <td align="center" colspan="2">
                        <button type="submit" value="Entrar">
                            Entrar
                        </button>
                    </td>
                </tr>
                <tr>
                    <td colspan="2" align="center">
                        <a href="../cadastro.html"> Não possuo uma conta</a>
                    </td>
                </tr>
            </table> 
        </div>
    </form>
</body>
<script>
    function mascaraCPF(input) {
        // Remove tudo que não é número
        let cpf = input.value.replace(/\D/g, '');
        
        // Aplica a máscara: 000.000.000-00
        cpf = cpf.replace(/(\d{3})(\d)/, '$1.$2');
        cpf = cpf.replace(/(\d{3})(\d)/, '$1.$2');
        cpf = cpf.replace(/(\d{3})(\d{1,2})$/, '$1-$2');
        
        input.value = cpf;
    }
</script>
</html>
