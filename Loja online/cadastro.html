<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="body" background="../Imagens/Fundo.avif">
    <form action="cadastro_cliente.php" method="post">
        <div style="display: flex; justify-content: center; align-items: center; min-height: 100vh;">
            <table class="table_cadastro">
                    <tr> 
                        <td align="center" colspan="2">
                            <h1>
                                Crie sua conta
                            </h1>
                        </td>
                    </tr>
                    <tr>
                        <th>
                            <label>Nome:</label>
                        </th>
                        <td>
                            <input type="text" name="nome" placeholder="Digite seu Nome:" required>
                        </td>
                    </tr>
                    <tr>
                        <th>
                            <label>E-mail:</label>
                        </th>
                        <td>
                            <input type="email" name="email" placeholder="Digite seu E-mail" required>
                        </td>
                    </tr>
                    <tr>
                        <th>
                            <label>CPF:</label>
                        </th>
                        <td>
                            <input type="text" id="cpf" name="cpf" maxlength="14" oninput="mascaraCPF(this)"  placeholder="000.000.000-00" required>
                        </td>
                    </tr>
                    <tr>
                        <th>
                            <label>Senha:</label>
                        </th>
                        <td>
                            <input type="password" name="senha" placeholder="Digite sua senha" required>
                        </td>
                    </tr>
                    <tr>
                        <th colspan="2">
                            ENDEREÇO
                        </th>
                    </tr>
                    <tr>
                        <th>
                            CEP:
                        </th>
                        <td>
                            <input type="text" name="cep" id="cep" placeholder="Digite o CEP do seu endereço" required maxlength="9" oninput="mascaraCEP(this)">
                        </td>
                    </tr>
                    <tr>
                        <th>
                            <label>Rua:</label>
                        </th>
                        <td>
                            <input type="text" name="rua" placeholder="Digite sua Rua" required>
                        </td>
                    </tr>
                    <tr>
                        <th>
                            <label>Número:</label>
                        </th>
                        <td>
                            <input type="number" name="numero" placeholder="Digite o número" required>
                        </td>
                    </tr>
                    <tr>
                        <th>
                            <label>Bairro:</label>
                        </th>
                            <td>
                                <input type="text" name="bairro" placeholder="Digite seu Bairro" required>
                            </td>
                    </tr>
                    <tr>
                        <td colspan="2" align="center">
                            <button type="submit" onclick="vazio()" id="table_cadastro_btn"> 
                                Cadastrar
                            </button>
                        </td>
                    </tr>
            </table>
        </div>
    </form>
</body>
<script>
    function mascaraCPF(input) 
        {
            // Remove tudo que não é número
            let cpf = input.value.replace(/\D/g, '');
            
            // Aplica a máscara: 000.000.000-00
            cpf = cpf.replace(/(\d{3})(\d)/, '$1.$2');
            cpf = cpf.replace(/(\d{3})(\d)/, '$1.$2');
            cpf = cpf.replace(/(\d{3})(\d{1,2})$/, '$1-$2');
            
            input.value = cpf;
        }
    function vazio() 
        {
            var nome = document.getElementById("nome").value;
        }
    function mascaraCEP(input) 
        {
            // Remove tudo que não é número
            let cep = input.value.replace(/\D/g, '');
            
            // Aplica a máscara: 00000-000
            cep = cep.replace(/(\d{5})(\d)/, '$1-$2');
            
            input.value = cep;
        }
</script>
</html>
