<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Popup</title>

    <style>
        /* Botão */
        .btn-abrir {
            padding: 12px 25px;
            background: #222;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        /* Fundo escuro */
        .modal-fundo {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;

            background: rgba(0, 0, 0, 0.65);

            justify-content: center;
            align-items: center;

            z-index: 9999;
        }

        /* Janelinha */
        .modal {
            background: white;
            width: 400px;
            max-width: 90%;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 5px 30px rgba(0,0,0,0.4);

            position: relative;
        }

        /* Botão fechar */
        .btn-fechar {
            position: absolute;
            right: 15px;
            top: 10px;

            border: none;
            background: none;

            font-size: 25px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>Minha página</h1>

    <!-- BOTÃO QUE ABRE O POPUP -->
    <button class="btn-abrir" type="button" onclick="abrirPopup()">
        Abrir Popup
    </button>


    <!-- POPUP -->
    <div id="modalFundo" class="modal-fundo">

        <div class="modal">

            <button 
                type="button"
                class="btn-fechar"
                onclick="fecharPopup()">
                ×
            </button>

            <h2>Meu Popup</h2>

            <p>
                Essa janelinha abriu sem sair da página.
            </p>

            <button type="button" onclick="fecharPopup()">
                Fechar
            </button>

        </div>

    </div>


    <script>

        function abrirPopup() {
            document.getElementById("modalFundo").style.display = "flex";
        }

        function fecharPopup() {
            document.getElementById("modalFundo").style.display = "none";
        }

        // Fechar clicando no fundo escuro
        document.getElementById("modalFundo").addEventListener("click", function(event) {

            if (event.target === this) {
                fecharPopup();
            }

        });

    </script>

</body>
</html>
