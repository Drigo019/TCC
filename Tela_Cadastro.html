<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css.css">
</head>
<body class="body">
    <form action="cadastro_de_cliente.php" method="post">
        <div style="display: flex; justify-content: center; align-items: center; min-height: 100vh;">
            <table>
                    <tr> 
                        <td align="center" colspan="2">
                            <img src="Imagens/Logo.png" style="width: 150px; height: 150px;">
                        </td>
                    </tr>
                    <tr>
                        <th>
                            <label>Nome:</label>
                        </th>
                        <td>
                            <input type="text" name="nome" placeholder="Digite seu Nome:" required >
                        </td>
                    </tr>
                    <tr>
                        <th>
                            <label>E-mail:</label>
                        </th>
                        <td>
                            <input type="email" name="email" placeholder="Digite seu E-mail" required>
                        </td>
                    </tr>
                    <tr>
                        <th>
                            <label>CPF:</label>
                        </th>
                        <td>
                            <input type="text" id="cpf" name="cpf" maxlength="14" oninput="mascaraCPF(this)"  placeholder="000.000.000-00" required>
                        </td>
                    </tr>
                    <tr>
                        <th>
                            <label>Senha:</label>
                        </th>
                        <td>
                            <input type="password" name="senha" placeholder="Digite sua senha" required>
                        </td>
                    </tr>
                    <tr>
                        <th colspan="2">
                            ENDEREÇO
                        </th>
                    </tr>
                    <tr>
                        <th>
                            <label>Rua:</label>
                        </th>
                        <td>
                            <input type="text" name="rua" placeholder="Digite sua Rua" required>
                        </td>
                    </tr>
                    <tr>
                        <th>
                            <label>Número:</label>
                        </th>
                        <td>
                            <input type="number" name="numero" placeholder="Digite o número" required>
                        </td>
                    </tr>
                    <tr>
                        <th>
                            <label>Bairro:</label>
                        </th>
                        <td>
                            <input type="text" name="bairro" placeholder="Digite seu Bairro" required>
                        </td>
                    </tr>
                    <tr>
                        <td colspan="2" align="center">
                            <button type="submit" onclick="vazio(), window.location.href='Tela_Login.html'"> 
                                Cadastrar
                            </button>
                        </td>
                    </tr>
                    <tr>
                        <td colspan="2" align="center">
                            <a href="Tela_Login.html"> Já possuo uma conta</a>
                        </td>
                    </tr>
            </table>
        </div>
    </form>
</body>
<style>
    table
        {
            border: black 2px solid;
            border-radius: 15px;
            border-collapse: separate; /* Necessário para funcionar */
            border-spacing: 10px;      /* Espaço horizontal e vertical */
            background-color: white;
        }
    tr, td, th
        {
            border-bottom: none;
            border-top: none;
            border-left: none;
            border-right: none;
        }
    body
        {
            background-image: url("Imagens/Fundo.jpeg");
            background-size: cover;
            background-repeat: no-repeat;
        }
</style>
<script>
    function mascaraCPF(input) 
        {
            // Remove tudo que não é número
            let cpf = input.value.replace(/\D/g, '');
            
            // Aplica a máscara: 000.000.000-00
            cpf = cpf.replace(/(\d{3})(\d)/, '$1.$2');
            cpf = cpf.replace(/(\d{3})(\d)/, '$1.$2');
            cpf = cpf.replace(/(\d{3})(\d{1,2})$/, '$1-$2');
            
            input.value = cpf;
        }
    function vazio() 
        {
            var nome = document.getElementById("nome").value;
        }
</script>
</html>
