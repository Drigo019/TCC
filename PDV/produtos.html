                .zoom-modal {

                    align-items: center;
                
                    opacity: 0;
                    visibility: hidden;
                
                    transition:
                        opacity 0.2s ease,
                        visibility 0.2s ease;
                }
                
                .zoom-modal img {
                    max-width: 85%;
                    max-height: 85%;
                
                    object-fit: contain;
                    border-radius: 12px;
                
                    transform: scale(0.7);
                    opacity: 0;
                
                    transition:
                        transform 0.2s ease,
                        opacity 0.2s ease;
                
                    cursor: zoom-out;
                }
                
                
                /* =========================
                   ABRINDO O ZOOM
                ========================= */
                
                .zoom-modal.ativo {
                    opacity: 1;
                    visibility: visible;
                }
                
                .zoom-modal.ativo img {
                    transform: scale(1);
                    opacity: 1;
                }
                
                
                /* =========================
                   FECHANDO O ZOOM
                ========================= */
                
                .zoom-modal.fechando {
                    opacity: 0;
                    visibility: visible;
                }
