        <script>

document
    .getElementById("formProduto")
    .addEventListener("submit", function(event) {

        event.preventDefault();


        const formulario = this;

        const dados = new FormData(formulario);


        const botao =
            formulario.querySelector(".btnSalvar");


        botao.disabled = true;

        botao.innerHTML = `
            <span
                class="spinner-border spinner-border-sm"
            ></span>

            Salvando...
        `;


        fetch("salvar_produto.php", {

            method: "POST",

            body: dados

        })

        .then(response => response.json())

        .then(resultado => {

            if (!resultado.sucesso) {

                alert(
                    resultado.mensagem ||
                    "Erro ao cadastrar o produto."
                );

                botao.disabled = false;

                botao.innerHTML =
                    "Salvar Produto";

                return;

            }


            /* =====================================
               ESCONDE O FORMULÁRIO
            ===================================== */

            formulario.style.display = "none";


            /* =====================================
               PREENCHE OS DADOS DA CONFIRMAÇÃO
            ===================================== */

            document.getElementById(
                "sucessoCodigo"
            ).textContent =
                resultado.produto.codigo;


            document.getElementById(
                "sucessoNome"
            ).textContent =
                resultado.produto.nome;


            document.getElementById(
                "sucessoPreco"
            ).textContent =
                "R$ " +
                parseFloat(
                    resultado.produto.preco
                ).toFixed(2).replace(".", ",");


            document.getElementById(
                "sucessoEstoque"
            ).textContent =
                resultado.produto.estoque +
                " unidade(s)";


            document.getElementById(
                "sucessoArmazenamento"
            ).textContent =
                resultado.produto.armazenamento;


            document.getElementById(
                "sucessoCategoria"
            ).textContent =
                resultado.produto.categoria;


            /* =====================================
               MOSTRA A MENSAGEM
            ===================================== */

            document.getElementById(
                "mensagemSucesso"
            ).style.display = "block";


            /* Volta para o topo */

            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });

        })

        .catch(error => {

            console.error(error);

            alert(
                "Erro de comunicação com o servidor."
            );

            botao.disabled = false;

            botao.innerHTML =
                "Salvar Produto";

        });

    });



/* =========================================
   CADASTRAR OUTRO PRODUTO
========================================= */

function novoProduto() {

    document.getElementById(
        "mensagemSucesso"
    ).style.display = "none";


    document.getElementById(
        "formProduto"
    ).style.display = "block";


    document.getElementById(
        "formProduto"
    ).reset();


    document.getElementById(
        "previewImagem"
    ).style.display = "none";


    document.getElementById(
        "previewImagem"
    ).src = "";


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}

</script>

<script>

    function alternarSidebar() {
    
        const sidebar =
            document.querySelector(".sidebar");
    
        const conteudo =
            document.querySelector(".conteudo-principal");
    
    
        sidebar.classList.toggle("escondida");
    
        conteudo.classList.toggle("sidebar-fechada");
    
    
        const fechada =
            sidebar.classList.contains("escondida");
    
    
        localStorage.setItem(
            "sidebarFechada",
            fechada
        );
    
    }
    
    
    /* =========================================
       MANTER ESTADO AO TROCAR DE PÁGINA
    ========================================= */
    
    document.addEventListener(
        "DOMContentLoaded",
        function() {
    
            const sidebar =
                document.querySelector(".sidebar");
    
            const conteudo =
                document.querySelector(".conteudo-principal");
    
    
            const fechada =
                localStorage.getItem(
                    "sidebarFechada"
                );
    
    
            if (fechada === "true") {
    
                sidebar.classList.add(
                    "escondida"
                );
    
                conteudo.classList.add(
                    "sidebar-fechada"
                );
    
            }
    
        }
    );
    
    </script>
