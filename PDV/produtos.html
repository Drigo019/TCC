<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" href="css/estilo.css">
</head>

<body class="bg-light">

<form action="php/salvar_produto.php" method="post" class="container mt-5">
    
    <input type="file" name="arquivoInput" accept="image/*"> <br>

    <img id="imagemPreview" alt="Pré-visualização da imagem">
    <script>

        const urlAPI = '';

        const arquivoInput = document.getElementById('arquivoInput');
        const imagemPreview = document.getElementById('imagemPreview');

        arquivoInput.addEventListener('change', function(event) {
            const arquivo = event.target.files[0];

            if (arquivo) {
                const leitor = new FileReader();

                leitor.onload = function(e) {
                    // Define o caminho da imagem como o resultado da leitura do arquivo
                    imagemPreview.src = e.target.result;
                    // Exibe a tag de imagem na página
                    imagemPreview.style.display = 'block';
                }

                // Lê o arquivo como uma URL de Dados (Data URL)
                leitor.readAsDataURL(arquivo);
            }
        });
    </script>


    <input type="text"
       name="codigo_barras"
       placeholder="Código de Barras"
       required
       class="form-control"><br>    
    
    <input type="text" name="nome" placeholder="Nome do Produto" required class="form-control"><br>

    <input type="number" name="preco" step="0.01" placeholder="Preço" required class="form-control"><br>

    <input type="number" name="estoque" placeholder="Estoque" required class="form-control"><br>

    <button type="submit" class="btn btn-success">
        Salvar Produto
    </button>

</form> 

<script src="js/script.js"></script>    

</body>
</html>
