        <!DOCTYPE html>
        <html lang="en">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Document</title>

            <!-- Bootstrap -->
            <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

            <!-- Bootstrap Icons -->
            <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

            <link rel="stylesheet" href="css/estilo.css">
    <style>
            /* Cor padrão */
    #formProduto{
        transition: .4s;
        padding:25px;
        border-radius:15px;
    }

    /* Refrigerado */
    .tema-azul{
        background:#dae0ff;
        border:3px solid #1c4de0;
    }

    /* Não Refrigerado */
    .tema-amarelo{
        background:#fff8db;
        border:3px solid #ffc107;
    }
    </style>
        </head>

        <body class="bg-light">
            <form action="salvar_produto.php"
            method="post"
            class="container mt-5"
            id="formProduto"
            enctype="multipart/form-data">
            
            <label for="arquivo">Escolha a imagem do produto</label>

    <input type="file"
        name="arquivo"
        id="arquivo"
        accept="image/*"
        required>

    <br><br>

    <img id="previewImagem"
        src=""
        alt="Pré-visualização"
        style="
            display:none;
            width:140px;
            height:140px;
            object-fit:cover;
            border-radius:12px;
            border:2px solid #0d6efd;
            box-shadow:0 3px 8px rgba(0,0,0,.2);
        ">

    <br><br>

            <input type="text"
            name="codigo_barras"
            placeholder="𝄃𝄃𝄂𝄂𝄀𝄁𝄃𝄂𝄂𝄃 Código de Barras"
            required
            class="form-control"><br>    
            
            <input type="text" name="nome" placeholder="🏷️Nome do Produto" required class="form-control"><br>

            <input type="number" name="preco" step="0.01" placeholder="💲Preço" required class="form-control"><br>

            <input type="number" name="estoque" placeholder="📦 Estoque" required
        class="form-control"><br>

        <div class="mb-3">
            <label class="form-label">
                <i class="bi bi-snow"></i> Tipo de Armazenamento
            </label>

            <select class="form-select"
            id="armazenamento"
            name="armazenamento"
            required>
            <option value="" selected disabled>Selecione...</option>    
                <option value="Refrigerado">🔵 Refrigerado</option>
                <option value="Normal">🟡 Não Refrigerado</option>
            </select>
        </div>

        <button type="submit" class="btn btn-success btnSalvar">
            Salvar Produto
        </button>
    

            

        </form> 

        <script src="script.js"></script>    

        </body>
        </html>
