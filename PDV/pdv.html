<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PDV</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Ícones -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-5">

    <div class="row justify-content-center">
        <div class="col-md-8">

            <div class="card shadow border-0 rounded-4">

                <div class="card-body p-4">

                    <h2 class="text-center mb-4">
                        <i class="bi bi-cart-fill text-success"></i>
                        PDV
                    </h2>

                    <!-- Inputs -->
                    <div class="row g-3">

                        <div class="col-md-8">
                            <input type="text"
                                   id="codigo"
                                   class="form-control form-control-lg"
                                   placeholder="Leia o código de barras"
                                   autofocus>
                        </div>
                        
                        <div class="col-md-4">
                            <button onclick="buscarProduto()"
                                    class="btn btn-success w-100 btn-lg">
                                <i class="bi bi-upc-scan"></i>
                                Buscar
                            </button>
                        </div>

                        <script>

                            const precoInput = document.getElementById("preco");
                            
                            precoInput.addEventListener("input", function(e){
                            
                                let valor = e.target.value;
                            
                                // remove tudo que não for número
                                valor = valor.replace(/\D/g, "");
                            
                                // transforma em centavos
                                valor = (parseInt(valor) / 100).toFixed(2) + "";
                            
                                // troca ponto por vírgula
                                valor = valor.replace(".", ",");
                            
                                // adiciona no input
                                e.target.value = valor;
                            
                            });
                            
                            </script>

                        <div class="col-md-4">
                            <button onclick="adicionar()"
                                    class="btn btn-success w-100">
                                <i class="bi bi-plus-circle"></i>
                                Adicionar
                            </button>
                        </div>

                    </div>

                    <!-- Lista -->
                    <div class="table-responsive mt-4">

                        <table class="table table-hover align-middle">

                            <thead class="table-success">
                                <tr>
                                    <th>Produto</th>
                                    <th>Preço</th>
                                </tr>
                            </thead>

                            <tbody id="lista">
                            </tbody>

                        </table>

                    </div>

                    <!-- Total -->
                    <div class="text-end mt-4">

                        <h3>Total: R$ <span id="total">0.00</span></h3>

                    </div>

                </div>

            </div>

        </div>
    </div>

</div>

<script>

    let total = 0;
    
    function buscarProduto(){
    
        let codigo = document.getElementById("codigo").value;
    
        fetch("php/buscar_produto.php?codigo=" + codigo)
    
        .then(response => response.json())
    
        .then(produto => {
    
            if(produto.erro){
                alert("Produto não encontrado!");
                return;
            }
    
            adicionarProduto(
                produto.nome,
                parseFloat(produto.preco)
            );
    
            document.getElementById("codigo").value = "";
    
        });
    
    }
    
    function adicionarProduto(nome, preco){
    
        let linha = `
            <tr>
                <td>${nome}</td>
                <td>R$ ${preco.toFixed(2)}</td>
            </tr>
        `;
    
        document.getElementById("lista").innerHTML += linha;
    
        total += preco;
    
        document.getElementById("total").textContent =
            total.toFixed(2);
    
    }
    
    // leitor normalmente aperta ENTER sozinho
    document.getElementById("codigo")
    .addEventListener("keypress", function(event){
    
        if(event.key === "Enter"){
    
            event.preventDefault();
    
            buscarProduto();
    
        }
    
    });
    
    </script>

</body>
</html>
