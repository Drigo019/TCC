<script>


/* =========================================================
   VARIÁVEIS
========================================================= */

let total = 0;

let tipoCartaoEscolhido = "";



/* =========================================================
   BUSCAR PRODUTO
========================================================= */

function buscarProduto() {


    const campo =
        document.getElementById("codigo");


    const codigo =
        campo.value.trim();


    if (codigo === "") {

        alert(
            "Digite ou leia o código de barras!"
        );

        campo.focus();

        return;

    }


    fetch(
        "buscar_produto.php?codigo=" +
        encodeURIComponent(codigo)
    )


    .then(response => {


        if (!response.ok) {

            throw new Error(
                "Erro na resposta do servidor."
            );

        }


        return response.json();

    })


    .then(produto => {


        if (produto.erro) {

            alert(
                produto.mensagem ||
                "Produto não encontrado!"
            );

            campo.select();

            return;

        }


        adicionarProduto(produto);


        campo.value = "";


        campo.focus();

    })


    .catch(error => {


        console.error(error);


        alert(
            "Erro ao buscar o produto."
        );

    });

}



/* =========================================================
   ADICIONAR PRODUTO
========================================================= */

function adicionarProduto(produto) {


    const preco =
        parseFloat(produto.valor);


    const lista =
        document.getElementById("lista");


    /*
     * Verifica se o produto já está
     * no carrinho.
     */

    const linhaExistente =
        lista.querySelector(
            `tr[data-codigo="${produto.codigoDeBarras}"]`
        );


    /* =====================================
       PRODUTO JÁ EXISTE
    ====================================== */

    if (linhaExistente) {


        const quantidadeElement =
            linhaExistente.querySelector(
                ".quantidade"
            );


        let quantidade =
            parseInt(
                quantidadeElement.textContent
            );


        const estoque =
            parseInt(
                linhaExistente.dataset.estoque
            );


        if (quantidade >= estoque) {

            alert(
                "Não há mais unidades desse produto em estoque."
            );

            return;

        }


        quantidade++;


        quantidadeElement.textContent =
            quantidade;


        const estoqueElement =
            linhaExistente.querySelector(
                ".estoque-atual"
            );


        estoqueElement.textContent =
            estoque - quantidade;


        atualizarTotal();


        return;

    }



    /* =====================================
       PRODUTO NOVO
    ====================================== */

    const estoque =
        parseInt(produto.estoque);


    if (estoque <= 0) {

        alert(
            "Este produto está sem estoque."
        );

        return;

    }


    const linha =
        document.createElement("tr");


    /*
     * ID CORRETO:
     *
     * idProduto
     */

    linha.dataset.id =
        produto.idProduto;


    linha.dataset.codigo =
        produto.codigoDeBarras;


    linha.dataset.preco =
        preco;


    linha.dataset.estoque =
        estoque;



    linha.innerHTML = `

        <td>
            ${produto.idProduto}
        </td>

        <td>
            ${produto.nome}
        </td>

        <td>
            ${produto.categoria ?? "-"}
        </td>

        <td>
            ${produto.Armazenamento ?? "-"}
        </td>

        <td>
            ${produto.codigoDeBarras}
        </td>

        <td>
            R$ ${preco.toFixed(2)}
        </td>

        <td>
            ${produto.validade || "-"}
        </td>

        <td class="estoque-atual">
            ${estoque - 1}
        </td>

        <td>

            <div
                class="d-flex align-items-center gap-2"
            >

                <button
                    type="button"
                    class="btn btn-danger btn-sm"
                    onclick="diminuirQuantidade(this)"
                >

                    <i class="bi bi-dash"></i>

                </button>


                <strong class="quantidade">
                    1
                </strong>


                <button
                    type="button"
                    class="btn btn-success btn-sm"
                    onclick="aumentarQuantidade(this)"
                >

                    <i class="bi bi-plus"></i>

                </button>

            </div>

        </td>

    `;


    lista.appendChild(linha);


    atualizarTotal();

}



/* =========================================================
   AUMENTAR QUANTIDADE
========================================================= */

function aumentarQuantidade(botao) {


    const linha =
        botao.closest("tr");


    const quantidadeElement =
        linha.querySelector(
            ".quantidade"
        );


    const estoqueElement =
        linha.querySelector(
            ".estoque-atual"
        );


    let quantidade =
        parseInt(
            quantidadeElement.textContent
        );


    const estoqueOriginal =
        parseInt(
            linha.dataset.estoque
        );


    if (quantidade >= estoqueOriginal) {

        alert(
            "Não há mais unidades desse produto em estoque."
        );

        return;

    }


    quantidade++;


    quantidadeElement.textContent =
        quantidade;


    estoqueElement.textContent =
        estoqueOriginal - quantidade;


    atualizarTotal();

}



/* =========================================================
   DIMINUIR QUANTIDADE
========================================================= */

function diminuirQuantidade(botao) {


    const linha =
        botao.closest("tr");


    const quantidadeElement =
        linha.querySelector(
            ".quantidade"
        );


    const estoqueElement =
        linha.querySelector(
            ".estoque-atual"
        );


    let quantidade =
        parseInt(
            quantidadeElement.textContent
        );


    const estoqueOriginal =
        parseInt(
            linha.dataset.estoque
        );


    quantidade--;


    /*
     * Se chegar a zero,
     * remove o produto.
     */

    if (quantidade <= 0) {

        linha.remove();

    }

    else {

        quantidadeElement.textContent =
            quantidade;


        estoqueElement.textContent =
            estoqueOriginal - quantidade;

    }


    atualizarTotal();

}



/* =========================================================
   ATUALIZAR TOTAL
========================================================= */

function atualizarTotal() {


    total = 0;


    const linhas =
        document.querySelectorAll(
            "#lista tr"
        );


    linhas.forEach(linha => {


        const preco =
            parseFloat(
                linha.dataset.preco
            );


        const quantidade =
            parseInt(
                linha.querySelector(
                    ".quantidade"
                ).textContent
            );


        total +=
            preco * quantidade;

    });


    document.getElementById(
        "total"
    ).textContent =
        total.toFixed(2);

}



/* =========================================================
   ENTER DO CÓDIGO DE BARRAS
========================================================= */

document
    .getElementById("codigo")
    .addEventListener(
        "keypress",
        function(event) {


            if (
                event.key === "Enter"
            ) {

                event.preventDefault();

                buscarProduto();

            }

        }
    );



/* =========================================================
   ABRIR PAGAMENTO
========================================================= */

function abrirPagamento() {


    const produtos =
        document.querySelectorAll(
            "#lista tr"
        );


    if (produtos.length === 0) {

        alert(
            "Adicione pelo menos um produto antes de finalizar a compra."
        );

        return;

    }


    /*
     * Atualiza valores
     */

    document.getElementById(
        "totalPagamento"
    ).textContent =
        total.toFixed(2);


    document.getElementById(
        "valorCartao"
    ).textContent =
        total.toFixed(2);


    /*
     * Mostra opções
     */

    document.getElementById(
        "pagamentoOpcoes"
    ).style.display =
        "block";


    /*
     * Esconde cartão
     */

    document.getElementById(
        "pagamentoCartao"
    ).style.display =
        "none";


    /*
     * Reseta cartão
     */

    tipoCartaoSelecionado = "";


    document.getElementById(
        "tipoCartaoSelecionado"
    ).innerHTML =
        "";


    document.getElementById(
        "confirmarCartao"
    ).style.display =
        "none";


    /*
     * Abre modal
     */

    const modalElement =
        document.getElementById(
            "modalPagamento"
        );


    const modal =
        new bootstrap.Modal(
            modalElement
        );


    modal.show();

}

   PIX
========================================================= */

    confirmarPagamento("Pix");

}

   DINHEIRO
========================================================= */

/* =========================================================

/* =========================================================

========================================================= */

function selecionarCartao() {


    document.getElementById(
        "pagamentoOpcoes"

        "none";


    document.getElementById(
        "pagamentoCartao"
    ).style.display =
        "block";


    document.getElementById(
        "tipoCartaoSelecionado"
    ).innerHTML =
        "";


    document.getElementById(
        "confirmarCartao"
    ).style.display =
        "none";


    tipoCartaoSelecionado = "";

}



/* =========================================================
   SELECIONAR DÉBITO / CRÉDITO
========================================================= */

function selecionarTipoCartao(tipo) {

tipoCartaoEscolhido = tipo;

let nome = "";

if (tipo === "Debito") {

    nome = "Débito";

}

else if (tipo === "Credito") {

    nome = "Crédito";

}

document.getElementById(
    "tipoCartaoSelecionado"
).innerHTML = `

    <div class="alert alert-primary">

        Pagamento selecionado:

        <strong>
            ${nome}
        </strong>

    </div>

`;

document.getElementById(
    "confirmarCartao"
).style.display =
    "inline-block";
}



/* =========================================================
   VOLTAR PARA FORMAS DE PAGAMENTO
========================================================= */

function voltarPagamento() {


    document.getElementById(
        "pagamentoCartao"
    ).style.display =
        "none";


    document.getElementById(
        "pagamentoOpcoes"

/* =========================================================
   CONFIRMAR PAGAMENTO
========================================================= */

function confirmarPagamento(
    formaDePagamento
) {


    console.log(
        "Forma escolhida:",
        formaDePagamento
    );


    /*
     * Verifica total
     */

    if (total <= 0) {

        alert(
            "Não há produtos na venda."
        );

        return;

    }


    /*
     * Converte a forma escolhida
     * para o ENUM do banco.
     *
     * Banco:
     *
     * Dinheiro
     * Cartao
     * Pix
     * Crediario
     */

    let formaBanco = "";


    if (
        formaDePagamento === "Pix"
    ) {

        formaBanco =
            "Pix";

    }

    else if (
        formaDePagamento === "Dinheiro"
    ) {

        formaBanco =
            "Dinheiro";

    }

    else if (
        formaDePagamento === "Crediario"
    ) {

        formaBanco =
            "Crediario";

    }

    else if (
        formaDePagamento === "Debito"
    ) {

        /*
         * Débito é salvo como Cartao
         */

        formaBanco =
            "Cartao";

    }

    else if (
        formaDePagamento === "Credito"
    ) {

        /*
         * Crédito é salvo como Cartao
         */

        formaBanco =
            "Cartao";

    }

    else {

        alert(
            "Forma de pagamento inválida: " +
            formaDePagamento
        );

        return;

    }



    /* =========================================
       PEGAR PRODUTOS
    ========================================== */

    const linhas =
        document.querySelectorAll(
            "#lista tr"
        );


    const produtos = [];


    linhas.forEach(
        linha => {


            /*
             * O banco usa idProduto
             */

            const id =
                parseInt(
                    linha.dataset.id
                );


            const quantidade =
                parseInt(
                    linha.querySelector(
                        ".quantidade"
                    ).textContent
                );


            if (
                !isNaN(id) &&
                quantidade > 0
            ) {

                produtos.push({

                    id:
                        id,

                    quantidade:
                        quantidade

                });

            }

        }
    );



    /* =========================================
       VERIFICA PRODUTOS
    ========================================== */

    if (
        produtos.length === 0
    ) {

        alert(
            "Nenhum produto válido foi encontrado no carrinho."
        );

        return;

    }



    /* =========================================
       NOME DA FORMA DE PAGAMENTO
    ========================================== */

    let nomeForma =
        formaDePagamento;


    if (
        formaDePagamento === "Crediario"
    ) {

        nomeForma =
            "CREDIÁRIO";

    }

    else if (
        formaDePagamento === "Debito"
    ) {

        nomeForma =
            "DÉBITO";

    }

    else if (
        formaDePagamento === "Credito"
    ) {

        nomeForma =
            "CRÉDITO";

    }

    else {

        nomeForma =
            formaDePagamento.toUpperCase();

    }



    /* =========================================
       CONFIRMAÇÃO
    ========================================== */

    const confirmar =
        confirm(

            "Confirmar pagamento?\n\n" +

            "Forma: " +
            nomeForma +

            "\nValor: R$ " +
            total.toFixed(2)

        );


    if (!confirmar) {

        return;

    }



    /* =========================================
       ENVIA PARA PHP
    ========================================== */

    fetch(
        "finalizar_venda.php",
        {

            method: "POST",

            headers: {

                "Content-Type":
                    "application/json"

            },

            body: JSON.stringify({

valor:
    total,

formaDePagamento:
    formaBanco,

produtos:
    produtos

})

        }
    )


    /* =========================================
       RESPOSTA
    ========================================== */

    .then(
        response => {

            return response.text();

        }
    )


    .then(
        texto => {


            console.log(
                "Resposta do PHP:",
                texto
            );


            let resultado;


            try {

                resultado =
                    JSON.parse(texto);

            }

            catch (erro) {


                alert(

                    "O servidor retornou uma resposta inválida:\n\n" +
                    texto

                );


                return;

            }



            /* =====================================
               ERRO DO PHP
            ====================================== */

            if (
                !resultado.sucesso
            ) {

                alert(

                    "Erro ao finalizar venda:\n\n" +
                    resultado.mensagem

                );

                return;

            }



            /* =====================================
               SUCESSO
            ====================================== */

            alert(

                "Venda realizada com sucesso!\n\n" +

                "Venda Nº " +

                resultado.idVenda

            );



            /* =====================================
               LIMPA CARRINHO
            ====================================== */

            document.getElementById(
                "lista"
            ).innerHTML =
                "";


            total =
                0;


            document.getElementById(
                "total"
            ).textContent =
                "0.00";



            /* =====================================
               FECHA MODAL
            ====================================== */

            const modalElement =
                document.getElementById(
                    "modalPagamento"
                );


            const modal =
                bootstrap.Modal.getInstance(
                    modalElement
                );


            if (modal) {

                modal.hide();

            }



            /* =====================================
               LIMPA CÓDIGO
            ====================================== */

            document.getElementById(
                "codigo"
            ).value =
                "";


            document.getElementById(
                "codigo"
            ).focus();



            /* =====================================
               VOLTA AO DASHBOARD
            ====================================== */

            setTimeout(
                function() {

                    window.location.href =
                        "index.php";

                },
                500
            );

        }
    )


    /* =========================================
       ERRO DE COMUNICAÇÃO
    ========================================== */

    .catch(
        error => {


            console.error(
                "Erro:",
                error
            );


            alert(

                "Erro de comunicação com o servidor:\n\n" +
                error.message

            );

        }
    );

}

</script>


<script>

    function alternarSidebar() {
    
        const sidebar =
            document.querySelector(".sidebar");
    
        const conteudo =
            document.querySelector(".conteudo-principal");
    
    
        sidebar.classList.toggle("escondida");
    
        conteudo.classList.toggle("sidebar-fechada");
    
    
        const fechada =
            sidebar.classList.contains("escondida");
    
    
        localStorage.setItem(
            "sidebarFechada",
            fechada
        );
    
    }
    
    
    /* =========================================
       MANTER ESTADO AO TROCAR DE PÁGINA
    ========================================= */
    
    document.addEventListener(
        "DOMContentLoaded",
        function() {
    
            const sidebar =
                document.querySelector(".sidebar");
    
            const conteudo =
                document.querySelector(".conteudo-principal");
    
    
            const fechada =
                localStorage.getItem(
                    "sidebarFechada"
                );
    
    
            if (fechada === "true") {
    
                sidebar.classList.add(
                    "escondida"
                );
    
                conteudo.classList.add(
                    "sidebar-fechada"
                );
    
            }
    
        }
    );
    
    </script>
</body>
