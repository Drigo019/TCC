<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PDV</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Ícones -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-5">

    <div class="row justify-content-center">
        <div class="col-md-8">

            <div class="card shadow border-0 rounded-4">

                <div class="card-body p-4">

                    <h2 class="text-center mb-4">
                        <i class="bi bi-cart-fill text-success"></i>
                        PDV
                    </h2>

                    <!-- Busca do produto -->
                    <div class="row g-3">

                        <div class="col-md-8">

                            <input
                                type="text"
                                id="codigo"
                                class="form-control"
                                placeholder="Digite ou leia o código de barras"
                                autofocus
                            >

                        </div>

                        <div class="col-md-4">

                            <button
                                type="button"
                                class="btn btn-success w-100"
                                onclick="buscarProduto()"
                            >
                                <i class="bi bi-upc-scan"></i>
                                Buscar
                            </button>

                        </div>

                    </div>


                    <!-- Lista de produtos -->
                    <div class="table-responsive mt-4">

                        <table class="table table-hover align-middle">

                            <thead class="table-success">
                                <tr>
                                    <th>ID</th>
                                    <th>Produto</th>
                                    <th>Categoria</th>
                                    <th>Armazenamento</th>
                                    <th>Código de Barras</th>
                                    <th>Preço</th>
                                    <th>Validade</th>
                                    <th>Estoque</th>
                                </tr>
                            </thead>

                            <tbody id="lista">
                                
                            </tbody>

                        </table>

                    </div>


                    <!-- Total -->
                    <div class="text-end mt-4">

                        <h3>
                            Total: R$
                            <span id="total">0.00</span>
                        </h3>

                    </div>

                </div>

            </div>

        </div>
    </div>

</div>


<script>

let total = 0;


/* ==========================================
   BUSCAR PRODUTO PELO CÓDIGO DE BARRAS
   ========================================== */

function buscarProduto() {

    let campo = document.getElementById("codigo");

    let codigo = campo.value.trim();


    // Não permite busca vazia
    if (codigo === "") {

        alert("Digite ou leia o código de barras!");

        campo.focus();

        return;
    }


    fetch(
    "buscar_produto.php?codigo=" +
    encodeURIComponent(codigo)
)

    .then(response => response.json())

    .then(produto => {

        if (produto.erro) {

            alert("Produto não encontrado!");

            campo.select();

            return;
        }


        // Adiciona o produto na lista
        adicionarProduto(
            produto.nome,
            parseFloat(produto.preco)
        );


        // Limpa o campo
        campo.value = "";


        // Devolve o foco para o campo
        campo.focus();

    })

    .catch(error => {

        console.error(error);

        alert("Erro ao buscar o produto.");

    });

}


/* ==========================================
   ADICIONAR PRODUTO NA LISTA
   ========================================== */

   function adicionarProduto(produto) {

let linha = `
    <tr>
        <td>${produto.idProdutos}</td>
        <td>${produto.nome}</td>
        <td>${produto.categoria}</td>
        <td>${produto.Armazenamento}</td>
        <td>${produto.codigoDeBarras}</td>
        <td>R$ ${parseFloat(produto.valor).toFixed(2)}</td>
        <td>${produto.validade ?? "-"}</td>
        <td>${produto.estoque}</td>
    </tr>
`;

document.getElementById("lista").innerHTML += linha;

total += parseFloat(produto.valor);

document.getElementById("total").textContent =
    total.toFixed(2);
}


/* ==========================================
   ENTER
   ========================================== */

// A pistola normalmente envia ENTER
// depois de ler o código.

document
    .getElementById("codigo")
    .addEventListener("keypress", function(event) {

        if (event.key === "Enter") {

            event.preventDefault();

            buscarProduto();

        }

    });

</script>

</body>
</html>
